name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 抓取 articles.txt 中尚未入库的文章
      - name: Sync articles
        run: python tools/update.py

      - name: Build site
        run: python tools/build_site.py
        env:
          SITE_BASE: https://${{ github.repository_owner }}.github.io/haopian2026/

      # 通道 A：Pages Source = GitHub Actions 时走这套
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 通道 B：Pages Source = Deploy from a branch → gh-pages 时走这套
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 仅当 Pages Source 配成 GitHub Actions 时这一步才生效；
      # 配成分支发布时会快速失败，continue-on-error 保证不影响整体流水线。
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # 发布完成后把全站 URL 推送给 IndexNow（Bing/Yandex 等即时收录）
      - name: Submit to IndexNow
        run: |
          sleep 20
          python tools/indexnow.py
        env:
          SITE_BASE: https://${{ github.repository_owner }}.github.io/haopian2026/
