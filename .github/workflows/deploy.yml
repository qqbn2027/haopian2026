name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 抓取 articles.txt 中尚未入库的文章
      - name: Sync articles
        run: python tools/update.py

      - name: Build site
        run: python tools/build_site.py
        env:
          SITE_BASE: https://${{ github.repository_owner }}.github.io/haopian2026/

      # 发布到 gh-pages 分支（Pages Source 选 Deploy from a branch → gh-pages → / (root)）
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      # 发布完成后把全站 URL 推送给 IndexNow（Bing/Yandex 等即时收录）
      - name: Submit to IndexNow
        run: |
          sleep 30  # 等 Pages 完成 gh-pages 分支发布
          python tools/indexnow.py
        env:
          SITE_BASE: https://${{ github.repository_owner }}.github.io/haopian2026/
